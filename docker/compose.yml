services:
  wham-gmr:
    image: wham-gmr:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-docker.m.daocloud.io/nvidia/cuda:13.0.0-cudnn-runtime-ubuntu22.04}
    working_dir: /opt/src/wham
    stdin_open: true
    tty: true
    ipc: host
    network_mode: host
    gpus: all
    environment:
      DISPLAY: ${DISPLAY:-}
      WHAM_PYTHON: /opt/conda/envs/wham_gmr/bin/python
      GMR_PYTHON: /opt/conda/envs/wham_gmr/bin/python
    volumes:
      - ${OUTPUT_ROOT:-./output}:/output
      - /tmp/.X11-unix:/tmp/.X11-unix
